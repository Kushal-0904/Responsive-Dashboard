<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-blue-900 text-white p-5 hidden md:block">
            <h1 class="text-2xl font-bold">Dashboard</h1>
            <nav class="mt-6">
                <ul>
                    <li class="py-2 px-4 hover:bg-blue-700 rounded"><a href="#">Home</a></li>
                    <li class="py-2 px-4 hover:bg-blue-700 rounded"><a href="#">Analytics</a></li>
                    <li class="py-2 px-4 hover:bg-blue-700 rounded"><a href="#">Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Top Navigation -->
            <header class="bg-white shadow p-4 flex justify-between items-center">
                <h2 class="text-lg font-semibold">Dashboard</h2>
                <button class="md:hidden bg-blue-900 text-white px-4 py-2 rounded">Menu</button>
            </header>

            <!-- Content Section -->
            <main class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-white p-4 rounded-lg shadow">
                    <h3 class="text-lg font-semibold">Total Users</h3>
                    <p class="text-2xl font-bold">1,245</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h3 class="text-lg font-semibold">Revenue</h3>
                    <p class="text-2xl font-bold">$12,530</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h3 class="text-lg font-semibold">New Orders</h3>
                    <p class="text-2xl font-bold">234</p>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
